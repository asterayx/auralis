name: Auralis
options:
  bundleIdPrefix: com.auralis
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: Auralis
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_EXPAND_BUILD_SETTINGS: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
targets:
  Auralis:
    type: application
    platform: iOS
    sources:
      - path: Auralis
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auralis.app
        INFOPLIST_FILE: Auralis/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Auralis
        INFOPLIST_KEY_LSRequiresIPhoneOS: YES
        CODE_SIGN_ENTITLEMENTS: Auralis/Resources/Auralis-iOS.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      gatherCoverageData: false
      testTargets: []
  AuralisMac:
    type: application
    platform: macOS
    sources:
      - path: Auralis
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.auralis.app.macos
        INFOPLIST_FILE: Auralis/Resources/Info-macOS.plist
        CODE_SIGN_ENTITLEMENTS: Auralis/Resources/Auralis.entitlements
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
