name: Auralis
options:
  bundleIdPrefix: com.auralis
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: Auralis
    EXECUTABLE_NAME: Auralis
    SWIFT_VERSION: "5.9"
    SWIFT_OBJC_BRIDGING_HEADER: Auralis/Platform/Auralis-Bridging-Header.h
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_EXPAND_BUILD_SETTINGS: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    DEVELOPMENT_TEAM: "${DEVELOPMENT_TEAM}"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SRCROOT)/Frameworks $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME) $(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework $(SRCROOT)/../shared/build/bin/iosArm64/debugFramework $(SRCROOT)/../shared/build/bin/iosSimulatorArm64/releaseFramework $(SRCROOT)/../shared/build/bin/iosSimulatorArm64/debugFramework $(SRCROOT)/../shared/build/bin/macosArm64/releaseFramework $(SRCROOT)/../shared/build/bin/macosArm64/debugFramework"
    OTHER_LDFLAGS: "$(inherited) -framework Shared"
targets:
  Auralis:
    type: application
    platform: iOS
    sources:
      - path: Auralis
        excludes:
          - "**/.DS_Store"
          - "Resources/Info.plist"
          - "Resources/Info-macOS.plist"
          - "Resources/*.entitlements"
    settings:
      base:
        PRODUCT_NAME: Auralis
        EXECUTABLE_NAME: Auralis
        PRODUCT_BUNDLE_IDENTIFIER: com.auralis.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Auralis/Resources/Info.plist
        INFOPLIST_EXPAND_BUILD_SETTINGS: YES
        SKIP_INSTALL: NO
        CODE_SIGN_ENTITLEMENTS: Auralis/Resources/Auralis-iOS.entitlements
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: Auralis/Platform/Auralis-Bridging-Header.h
    preBuildScripts:
      - name: Build Shared KMP
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          /bin/bash "$SRCROOT/ci/build-shared-framework.sh"
    scheme:
      gatherCoverageData: false
      testTargets: []
  AuralisMac:
    type: application
    platform: macOS
    sources:
      - path: Auralis
        excludes:
          - "**/.DS_Store"
          - "Resources/Info.plist"
          - "Resources/Info-macOS.plist"
          - "Resources/*.entitlements"
    settings:
      base:
        PRODUCT_NAME: Auralis
        EXECUTABLE_NAME: Auralis
        PRODUCT_BUNDLE_IDENTIFIER: com.auralis.app.macos
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Auralis/Resources/Info-macOS.plist
        INFOPLIST_EXPAND_BUILD_SETTINGS: YES
        CODE_SIGN_ENTITLEMENTS: Auralis/Resources/Auralis.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_OBJC_BRIDGING_HEADER: Auralis/Platform/Auralis-Bridging-Header.h
    preBuildScripts:
      - name: Build Shared KMP
        shell: /bin/bash
        basedOnDependencyAnalysis: false
        script: |
          /bin/bash "$SRCROOT/ci/build-shared-framework.sh"
    scheme:
      gatherCoverageData: false
