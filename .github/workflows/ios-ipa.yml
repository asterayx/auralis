name: iOS IPA

# Cloud macOS runner compiles and optionally uploads to TestFlight.
on:
  workflow_dispatch:
    inputs:
      export_method:
        description: IPA export method
        type: choice
        options: [development, ad-hoc, app-store]
        default: development
      upload_testflight:
        description: Upload the IPA to TestFlight (forces app-store signing)
        type: boolean
        default: false
  push:
    paths:
      - "iosApp/**"
      - ".github/workflows/ios-ipa.yml"

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      IOS_EXPORT_METHOD: ${{ github.event.inputs.upload_testflight == 'true' && 'app-store' || github.event.inputs.export_method || 'development' }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Decide signing
        id: signing
        run: |
          if [ -n "${DEVELOPMENT_TEAM}" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
            echo "Apple signing secrets are present."
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Missing GitHub secret DEVELOPMENT_TEAM (Apple Team ID)."
            echo "Also set BUILD_CERTIFICATE_BASE64, P12_PASSWORD, BUILD_PROVISION_PROFILE_BASE64."
            exit 1
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "No Apple signing secrets on this push; compiling unsigned instead of failing."
          fi
          if [ "${{ github.event.inputs.upload_testflight }}" = "true" ] || [ "$IOS_EXPORT_METHOD" = "app-store" ]; then
            if [ -z "${APP_STORE_CONNECT_KEY_ID}" ] || [ -z "${APP_STORE_CONNECT_ISSUER_ID}" ] || [ -z "${APP_STORE_CONNECT_API_KEY_P8}" ]; then
              echo "TestFlight upload needs APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_API_KEY_P8."
              if [ "${{ github.event.inputs.upload_testflight }}" = "true" ]; then
                exit 1
              fi
            fi
          fi

      - name: Import certificate and profile
        if: steps.signing.outputs.has_secrets == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/dist.p12"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          KC="$RUNNER_TEMP/auralis.keychain-db"
          KC_PWD="$(openssl rand -base64 24)"
          mkdir -p "$PROFILE_DIR"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$CERT"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > "$PROFILE_DIR/auralis.mobileprovision"
          security create-keychain -p "$KC_PWD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PWD" "$KC"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PWD" "$KC" >/dev/null
          security list-keychains -d user -s "$KC"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Compile unsigned
        if: steps.signing.outputs.has_secrets != 'true'
        run: bash iosApp/ci/compile-unsigned.sh

      - name: Archive and export IPA
        if: steps.signing.outputs.has_secrets == 'true'
        run: bash iosApp/ci/build-ipa.sh

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.has_secrets == 'true'
        with:
          name: Auralis-ipa
          path: dist/ios/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        if: ${{ github.event.inputs.upload_testflight == 'true' && steps.signing.outputs.has_secrets == 'true' }}
        run: |
          brew install fastlane
          bash iosApp/ci/upload-testflight.sh
